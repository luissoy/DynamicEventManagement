version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-app
    ports:
      - "10002:8080"
    environment:
      API_DATABASE_URL: http://database-app:8080/api/v1/
    networks:
      - tfg-network

networks:
  tfg-network:
    external:
      name: tfg-network