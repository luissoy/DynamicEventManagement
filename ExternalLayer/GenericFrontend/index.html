<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="functions.js"></script>
        <link rel="stylesheet" type="text/css" href="styles.css">
        <title>Custom App Front</title>
    </head>
    <body>
        <h1>Custom App: Emergency button</h1>
        <div class="container">
            <div class="box">
                <p>This is the user you are logged in to: Luis</p>
            </div>
            <div class="box">
                <p>This is the group you are sending the email to: Family</p>
            </div>
        </div>

        <div class="container">
            <h3>More information about this emergency:</h3>
            <div class="input-container">
                <input type="text" id="message" placeholder="Emergency message">
                <button onclick="sendEvent()">Send emergency email</button>
            </div>

            <div id="messagePopup" class="message-popup" style="display: none">
                <p>Email sent.</p>
            </div>
        </div>
    </body>
</html>
